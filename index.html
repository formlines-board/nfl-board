<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NFL 2026 — consensus board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F3; --sheet:#FFFFFF; --rule:#CFD6DD; --rule-soft:#E3E8ED;
  --ink:#16202B; --ink-2:#4A5764; --ink-3:#7B8794;
  --up:#1E6B45; --up-bg:#DDEFE4; --down:#96303B; --down-bg:#F5E0E2; --brass:#9C7A1F; --brass-bg:#F6EDD2;
  --rail:280px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.top{display:flex;align-items:baseline;gap:22px;padding:14px 22px;background:var(--sheet);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
.top h1{margin:0;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:20px;letter-spacing:.01em}
.top nav{display:flex;gap:4px;margin-left:auto}
.top nav button{padding:6px 12px;border-radius:4px;color:var(--ink-2)}
.top nav button[aria-current="page"]{background:var(--ink);color:#fff}
.top .meta{color:var(--ink-3);font-size:12.5px}
.top .menu{display:none}

.wrap{display:grid;grid-template-columns:var(--rail) 1fr;min-height:calc(100vh - 52px)}
.rail{background:var(--sheet);border-right:1px solid var(--rule);padding:14px 0 30px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.rail h3{margin:14px 22px 4px;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.rail button{display:flex;width:100%;padding:5px 22px;justify-content:space-between;align-items:baseline;text-align:left}
.rail button:hover{background:var(--paper)}
.rail button.on{background:var(--ink);color:#fff}
.rail .rec{font-size:12px;color:var(--ink-3)}
.rail button.on .rec{color:#C9D3DD}

main{padding:22px 26px 60px;max-width:1240px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;margin-bottom:6px}
.head h2{margin:0;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:34px;line-height:1}
.head .proj{color:var(--ink-2);font-size:13px}
.coach{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
.coach p{margin:0}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 16px 12px;margin-bottom:16px}
.card h4{margin:0 0 8px;font-size:13px;font-weight:600}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--ink-2)}
.ctl label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ctl .note{margin-left:auto;color:var(--ink-3)}

table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--ink-3);text-align:right;padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;font-size:12px}
th:first-child,th.l,td.l{text-align:left}
td{padding:6px 8px;border-bottom:1px solid var(--rule-soft);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sort.on{color:var(--ink);border-bottom-color:var(--ink)}
.bar{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;min-width:96px}
.bar i{display:block;height:9px;border-radius:2px}
.bar.up i{background:var(--up)} .bar.dn i{background:var(--down)}
.up{color:var(--up)} .dn{color:var(--down)}
.mv{display:inline-block;padding:1px 6px;border-radius:3px;font-size:12px}
.mv.brass{background:var(--brass-bg);color:var(--brass)}
.mv.up{background:var(--up-bg)} .mv.dn{background:var(--down-bg)}
.dim{color:var(--ink-3)}
.win{color:var(--up);font-weight:500} .loss{color:var(--down);font-weight:500}
.avg td{border-top:1px solid var(--rule);font-weight:500;background:#F7F9FB}

.prose{max-width:76ch;font-size:14px}
.prose p{margin:0 0 10px}
.prose strong{font-weight:600}
.prose table{font-size:12.5px;margin:6px 0 12px}
.prose th{text-align:left}
.prose td{text-align:left;white-space:normal}
details{border-top:1px solid var(--rule-soft);padding:10px 0}
details summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px}
details summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
details .prose{margin-top:10px}
.diggs{border-left:3px solid var(--brass);padding-left:12px}
.empty{color:var(--ink-3);padding:20px 0}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.game{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.game .teams{display:flex;justify-content:space-between;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:18px}
.game .lines{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin:4px 0 8px}
.game table{font-size:12.5px}
.game td,.game th{padding:3px 6px}
.wksel{display:flex;gap:4px;margin-bottom:14px}
.wksel button{padding:5px 11px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet)}
.wksel button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

button.game{text-align:left;width:100%;font:inherit;color:inherit}
button.game:hover{border-color:var(--ink-2)}
.game .score{font-size:16px;align-self:center;color:var(--ink-2)}
.game .lines{flex-wrap:wrap}
.lines.big{font-size:15px;margin:0 0 14px;display:flex;gap:22px;color:var(--ink-2)}
.cmp td,.cmp th{text-align:left;vertical-align:middle;padding:7px 8px}
.cmp th{font-size:14px;color:var(--ink);font-weight:600}
.cmp th .tl{font:inherit;font-weight:600}
.cmp th .dim{font-weight:400;font-size:12px}
.cmp td.lab{text-align:center;color:var(--ink-2);font-size:12.5px;width:34%}
.cmp td.r,.cmp th.r{text-align:right}
.cmp td.r .bar{justify-content:flex-end}
.cmp td .bar{justify-content:flex-start;min-width:0}
.cmp td.best{background:var(--up-bg)}
.cmp tr.sep td{padding:4px;border-bottom:1px solid var(--rule)}
.secnote{margin:0 0 10px;font-size:12px}
.wx{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.wxv{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:22px}
.wx .dim{font-size:12px}
.wxnote{margin-left:auto;text-align:right;max-width:44%}
@media (max-width:700px){.wxnote{margin-left:0;text-align:left;max-width:100%}}
.rk{display:inline-block;margin-left:5px;font-size:10.5px;color:var(--ink-3);vertical-align:super}
.cmp td.r .rk{margin-left:5px}
.lab2{color:var(--ink-2);font-weight:500}
.cmphead{display:flex;justify-content:space-between;font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:17px;margin:0 2px 10px}
.cmphead .r{text-align:right}
.cmphead .dim{font-family:"IBM Plex Sans",sans-serif;font-weight:400;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.log{font-size:12.5px;margin:6px 0 8px}
.log td,.log th{padding:4px 6px}
button.mu{font-size:12px;color:var(--brass);font-weight:500}
tr.up td{color:var(--ink-2)}
@media (max-width:900px){
  .two{grid-template-columns:1fr}
  .wrap{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:52px;width:min(320px,90vw);transform:translateX(-100%);transition:transform .18s;z-index:6;box-shadow:0 0 0 100vw rgba(22,32,43,0)}
  .rail.open{transform:none;box-shadow:0 0 0 100vw rgba(22,32,43,.35)}
  .top .menu{display:inline-block;color:var(--ink-2)}
  .top .meta{display:none}
  main{padding:16px 14px 50px}
  .head h2{font-size:28px}
  .card{overflow-x:auto}
  .games{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="menu" id="menu" aria-label="Teams">☰ Teams</button>
  <h1>NFL 2026 — consensus board</h1>
  <span class="meta" id="meta"></span>
  <nav>
    <button data-view="team" aria-current="page">Teams</button>
    <button data-view="league">League table</button>
    <button data-view="week">This week</button>
    <button data-view="notes">Almanac notes</button>
  </nav>
</header>
<div class="wrap">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>
<script src="data.js"></script>
<script>
(function(){
const D=window.NFL_DATA; if(!D){document.getElementById('main').innerHTML='<p class="empty">data.js not found. Run build_data.py in this folder, then reload.</p>';return;}
const S={view:'team',team:'ARI',match:null,lsec:'sides',filtered:true,noTO:true,week:null,sort:'epa',dir:-1,menu:false};
const $=id=>document.getElementById(id);
const F={
  pct:v=>v==null?'—':(v*100).toFixed(1)+'%',
  epa:v=>v==null?'—':(v>0?'+':'')+v.toFixed(3),
  sec:v=>v==null?'—':v.toFixed(1),
  line:v=>v==null?'—':v===0?'PK':(v>0?'+':'')+String(v),
  tot:v=>v==null?'—':String(v),
  pctpt:v=>v==null?'—':(v>0?'+':'')+v.toFixed(1),
  int0:v=>v==null?'—':Math.round(v).toString(),
  one:v=>v==null?'—':v.toFixed(1)
};
const divs=["AFC East","AFC North","AFC South","AFC West","NFC East","NFC North","NFC South","NFC West"];
const rec=t=>{const g=D.games.filter(x=>x.team===t);const w=g.filter(x=>x.pf>x.pa).length,l=g.filter(x=>x.pf<x.pa).length,tie=g.length-w-l;return g.length?`${w}-${l}${tie?'-'+tie:''}`:'';};
const st=g=>S.filtered?(S.noTO?g.f:g.f_to):(S.noTO?g.r:g.r_to);

function bar(v,scale,cls){ if(v==null)return '—'; const w=Math.min(48,Math.abs(v)/scale*48); return `<span class="bar ${v>=0?'up':'dn'} ${cls||''}"><i style="width:${w}px"></i>${F.epa(v)}</span>`;}
function move(o,c,inv){
  if(o==null||c==null)return `<span class="dim">${F.line(c)}</span>`;
  const d=c-o; if(Math.abs(d)<0.01) return F.line(c);
  const cls=inv?(d<0?'up':'dn'):'brass';
  return `<span class="mv ${cls}" title="opened ${F.line(o)}">${F.line(c)}</span>`;
}
function moveTot(o,c){ if(o==null||c==null)return `<span class="dim">${F.tot(c)}</span>`; const d=c-o; if(Math.abs(d)<0.01)return F.tot(c); return `<span class="mv brass" title="opened ${F.tot(o)}">${F.tot(c)}</span>`;}
let RANKS=null;
const RANKDIR={sr:1,opp_sr:-1,epa:1,opp_epa:-1,net:1,db_epa:1,opp_db_epa:-1,rush_epa:1,opp_rush_epa:-1,
  expl:1,opp_expl:-1,tempo:-1,ntempo:-1,proe:1,plays:1,
  sack_rate:-1,opp_sack_rate:1,hit_rate:-1,opp_hit_rate:1,stuff_rate:-1,opp_stuff_rate:1,
  ypc:1,opp_ypc:-1,ybc:1,press_allowed:-1,press_gen:1};
function rankMap(){
  if(RANKS)return RANKS;
  const all=Object.keys(D.teams).map(ab=>season(ab)); RANKS={};
  for(const [k,dir] of Object.entries(RANKDIR)){
    const v=all.filter(t=>t[k]!=null).sort((a,b)=>dir*(b[k]-a[k]));
    const m={}; v.forEach((t,i)=>m[t.ab]=i+1); RANKS[k]=m;
  }
  return RANKS;
}
function rk(ab,key){ const m=rankMap()[key]; if(!m||!m[ab])return '';
  return `<span class="rk">${m[ab]}</span>`; }
function mean(a){a=a.filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}

function rail(){
  let h='';
  for(const dv of divs){
    h+=`<h3>${dv}</h3>`;
    for(const [ab,t] of Object.entries(D.teams).filter(([a,t])=>t.division===dv).sort((a,b)=>a[1].name.localeCompare(b[1].name)))
      h+=`<button data-team="${ab}" class="${S.view==='team'&&S.team===ab?'on':''}"><span>${t.name}</span><span class="rec">${rec(ab)}</span></button>`;
  }
  $('rail').innerHTML=h;
  $('rail').classList.toggle('open',S.menu);
}
$('rail').addEventListener('click',e=>{const b=e.target.closest('button[data-team]');if(!b)return;S.team=b.dataset.team;S.view='team';S.menu=false;render();window.scrollTo(0,0);});
$('menu').addEventListener('click',()=>{S.menu=!S.menu;$('rail').classList.toggle('open',S.menu);});
document.querySelector('.top nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;S.view=b.dataset.view;render();});

function controls(extra){
  return `<div class="ctl">
    <label><input type="checkbox" id="filt" ${S.filtered?'checked':''}> Exclude garbage time (win probability outside 10–90%)</label>
    <label><input type="checkbox" id="noto" ${S.noTO?'checked':''}> Remove turnovers from EPA</label>
    <span class="note">${extra||''}</span></div>`;
}
function season(ab){
  const gs=D.games.filter(g=>g.team===ab); const s=k=>mean(gs.map(g=>st(g)[k]));
  const p=k=>mean(gs.map(g=>g.pfr&&g.pfr[k]!=null?g.pfr[k]:null));
  const psum=k=>{const v=gs.map(g=>g.pfr&&g.pfr[k]!=null?g.pfr[k]:null).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null;};
  const cnt=(k,v)=>gs.filter(g=>g[k]===v).length;
  const o={ab,gs,n:gs.length,rec:rec(ab),
    sr:s('sr'),opp_sr:s('opp_sr'),epa:s('epa'),opp_epa:s('opp_epa'),db_epa:s('db_epa'),opp_db_epa:s('opp_db_epa'),
    rush_epa:s('rush_epa'),opp_rush_epa:s('opp_rush_epa'),expl:s('expl'),opp_expl:s('opp_expl'),
    tempo:mean(gs.map(g=>S.filtered?g.tempo_f:g.tempo_r)),ntempo:mean(gs.map(g=>g.ntempo)),proe:mean(gs.map(g=>g.proe)),
    plays:mean(gs.map(g=>st(g).plays)),ppg:mean(gs.map(g=>g.pf)),papg:mean(gs.map(g=>g.pa)),
    sack_rate:s('sack_rate'),opp_sack_rate:s('opp_sack_rate'),hit_rate:s('hit_rate'),opp_hit_rate:s('opp_hit_rate'),
    stuff_rate:s('stuff_rate'),opp_stuff_rate:s('opp_stuff_rate'),ypc:s('ypc'),opp_ypc:s('opp_ypc'),
    rush_sr:s('rush_sr'),opp_rush_sr:s('opp_rush_sr'),
    ybc:p('ybc'),opp_ybc:p('opp_ybc'),press_allowed:psum('pressures_allowed'),press_gen:psum('pressures_generated'),
    blitz_faced:psum('blitzes_faced'),blitz_sent:psum('blitzes_sent'),
    mkt_for:cnt('market','for'),mkt_against:cnt('market','against'),mkt_push:cnt('market','push'),
    tot_over:cnt('total_market','over'),tot_under:cnt('total_market','under'),tot_push:cnt('total_market','push'),
    ats_w:cnt('ats','win'),ats_l:cnt('ats','loss'),ats_p:cnt('ats','push'),
    ou_o:cnt('ou','over'),ou_u:cnt('ou','under'),ou_p:cnt('ou','push')};
  o.net=(o.epa!=null&&o.opp_epa!=null)?o.epa-o.opp_epa:null;
  o.ats=o.ats_w+o.ats_l+o.ats_p?`${o.ats_w}-${o.ats_l}${o.ats_p?'-'+o.ats_p:''}`:'—';
  o.atsv=(o.ats_w+o.ats_l)?o.ats_w/(o.ats_w+o.ats_l):null;
  o.ou=(o.ou_o+o.ou_u+o.ou_p)?`${o.ou_o}-${o.ou_u}${o.ou_p?'-'+o.ou_p:''}`:'—';
  o.mkt=`${o.mkt_for}-${o.mkt_against}${o.mkt_push?'-'+o.mkt_push:''}`;
  o.mktv=(o.mkt_for+o.mkt_against)?o.mkt_for/(o.mkt_for+o.mkt_against):null;
  return o;
}
function windowMarket(gs,n){
  const w=gs.slice().sort((a,b)=>b.week-a.week).slice(0,n);
  const c=(k,v)=>w.filter(g=>g[k]===v).length;
  return {for:c('market','for'),against:c('market','against'),push:c('market','push'),
          over:c('total_market','over'),under:c('total_market','under'),tpush:c('total_market','push'),
          ats_w:c('ats','win'),ats_l:c('ats','loss'),ou_o:c('ou','over'),ou_u:c('ou','under'),n:w.length};
}
function findUpcoming(ab){ const rows=[];
  for(const [wk,gm] of Object.entries(D.upcoming||{})) for(const [k,v] of Object.entries(gm)){ const [a,h]=k.split('@'); if(a===ab||h===ab) rows.push({wk:+wk,a,h,v}); }
  return rows.sort((x,y)=>x.wk-y.wk); }
function mtag(m){ if(!m)return '<span class="dim">—</span>';
  if(m==='for')return '<span class="mv up">backed</span>'; if(m==='against')return '<span class="mv dn">opposed</span>';
  return '<span class="mv">flat</span>'; }
function ttag(m){ if(!m)return '<span class="dim">—</span>';
  if(m==='over')return '<span class="mv brass">bet over</span>'; if(m==='under')return '<span class="mv brass">bet under</span>';
  return '<span class="mv">flat</span>'; }

// ---------- venues & weather ----------
// [lat, lon, roof] roof: open | dome (always closed) | retract (roof may be open or shut)
const STAD={
 SEA00:[47.5952,-122.3316,'open'], CAR00:[35.2258,-80.8528,'open'], CIN00:[39.0955,-84.5161,'open'],
 DET00:[42.3400,-83.0456,'dome'], HOU00:[29.6847,-95.4107,'retract'], IND00:[39.7601,-86.1639,'retract'],
 JAX00:[30.3239,-81.6373,'open'], PIT00:[40.4468,-80.0158,'open'], NAS00:[36.1665,-86.7713,'open'],
 LAX01:[33.9535,-118.3392,'dome'], VEG00:[36.0909,-115.1833,'dome'], MIN01:[44.9736,-93.2575,'dome'],
 PHI00:[39.9008,-75.1675,'open'], NYC01:[40.8135,-74.0745,'open'], KAN00:[39.0489,-94.4839,'open'],
 BUF00:[42.7738,-78.7870,'open'], ATL97:[33.7554,-84.4009,'retract'], BAL00:[39.2780,-76.6227,'open'],
 CHI98:[41.8623,-87.6167,'open'], BOS00:[42.0909,-71.2643,'open'], TAM00:[27.9759,-82.5033,'open'],
 DEN00:[39.7439,-105.0201,'open'], PHO00:[33.5276,-112.2626,'retract'], DAL00:[32.7473,-97.0945,'retract'],
 SFO01:[37.4033,-121.9694,'open'], GNB00:[44.5013,-88.0622,'open'], CLE00:[41.5061,-81.6995,'open'],
 MIA00:[25.9580,-80.2389,'open'], WAS00:[38.9076,-76.8645,'open'], NOR00:[29.9511,-90.0812,'dome'],
 MEL00:[-37.8200,144.9834,'open'], RIO00:[-22.9121,-43.2302,'open'], LON02:[51.6043,-0.0665,'open'],
 LON00:[51.5560,-0.2795,'open'], PAR00:[48.9245,2.3601,'open'], MAD01:[40.4531,-3.6883,'retract'],
 MUN01:[48.2188,11.6247,'retract'], MEX00:[19.3029,-99.1505,'open']
};
const WXCODE={0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',
 53:'Drizzle',55:'Heavy drizzle',56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',
 65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',
 77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',
 95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};
function tzOffsetHours(date,tz){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',
    day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(date).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return (Date.UTC(p.year,p.month-1,p.day,p.hour%24,p.minute)-date.getTime())/3600000;
}
function kickoffUTC(date,time){
  if(!date||!time)return null;
  const naive=Date.parse(`${date}T${time}:00Z`); if(isNaN(naive))return null;
  return new Date(naive-tzOffsetHours(new Date(naive),'America/New_York')*3600000);
}
async function loadWeather(el,sched){
  const st=STAD[sched.sid];
  if(!st){el.innerHTML='<span class="dim">Venue not recognised, no forecast.</span>';return;}
  const [lat,lon,roof]=st;
  const ko=kickoffUTC(sched.date,sched.time);
  if(!ko){el.innerHTML='<span class="dim">Kickoff time not set yet.</span>';return;}
  const days=Math.ceil((ko-Date.now())/86400000);
  if(days<0){el.innerHTML='<span class="dim">Game has started.</span>';return;}
  if(roof==='dome'){el.innerHTML=`<strong>Indoors</strong> <span class="dim">\u00b7 ${sched.stadium} is a fixed roof, so no weather factor.</span>`;return;}
  if(days>15){el.innerHTML=`<span class="dim">${sched.stadium} \u00b7 forecast available nearer the game (${days} days out).</span>`;return;}
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`+
    `&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,wind_gusts_10m`+
    `&timezone=UTC&forecast_days=16&wind_speed_unit=mph`;
  try{
    const r=await fetch(url); const j=await r.json(); const H=j.hourly;
    const stamp=ko.toISOString().slice(0,13)+':00';
    let i=H.time.indexOf(stamp);
    if(i<0){ const t=ko.getTime(); i=H.time.reduce((best,s,n)=>Math.abs(Date.parse(s+'Z')-t)<Math.abs(Date.parse(H.time[best]+'Z')-t)?n:best,0); }
    const c=H.temperature_2m[i], f=Math.round(c*9/5+32), wind=Math.round(H.wind_speed_10m[i]),
      gust=Math.round(H.wind_gusts_10m[i]), pp=H.precipitation_probability[i], mm=H.precipitation[i],
      desc=WXCODE[H.weather_code[i]]||'\u2014';
    const windCls=wind>=15?'dn':''; const rainCls=pp>=50?'dn':'';
    el.innerHTML=`<div class="wx">
      <div><span class="wxv">${Math.round(c)}\u00b0C</span><span class="dim"> / ${f}\u00b0F</span><div class="dim">${desc}</div></div>
      <div><span class="wxv ${windCls}">${wind} mph</span><div class="dim">gusts ${gust} mph</div></div>
      <div><span class="wxv ${rainCls}">${pp}%</span><div class="dim">rain chance${mm>0?`, ${mm.toFixed(1)}mm`:''}</div></div>
      <div class="dim wxnote">${sched.stadium}${sched.neutral?' (neutral site)':''}${roof==='retract'?' \u00b7 retractable roof, may be shut':''}<br>Kickoff ${ko.toUTCString().slice(0,22)} UTC</div>
    </div>`;
  }catch(e){ el.innerHTML='<span class="dim">Forecast unavailable right now.</span>'; }
}

const SEC={

          ['Explosive','expl',F.pct],['Opp explosive','opp_expl',F.pct]]},
  totals:{title:'Totals',note:'Tempo and pass tendency \u2014 what drives the number of plays and points. Tempo is the real elapsed time between snaps, so it measures how quickly the offense gets to the line rather than how often the clock stopped. Neutral tempo and PROE cover neutral game states only and ignore the garbage-time toggle. Rank 1 = fastest tempo, most pass-heavy PROE.',
    cols:[['Tempo','tempo',F.sec],['Neutral tempo','ntempo',F.sec],['PROE','proe',F.pctpt],['Plays','plays',F.int0]]},

function cellVal(g,key){
  const s=st(g);
  if(key==='pf')return g.pf; if(key==='pa')return g.pa;
  if(key==='tempo')return S.filtered?g.tempo_f:g.tempo_r; if(key==='ntempo')return g.ntempo; if(key==='proe')return g.proe;
  if(['press_allowed','press_gen','blitz_faced','blitz_sent','ybc','opp_ybc'].includes(key)){
    const m={press_allowed:'pressures_allowed',press_gen:'pressures_generated',blitz_faced:'blitzes_faced',blitz_sent:'blitzes_sent',ybc:'ybc',opp_ybc:'opp_ybc'};
    return g.pfr?g.pfr[m[key]]:null; }
  return s[key];
}
function sectionTable(gs,sec,ab){
  const c=SEC[sec].cols;
  const head=`<tr><th class="l">Wk</th><th class="l">Opp</th><th class="l">Result</th>${c.map(x=>`<th>${x[0]}</th>`).join('')}</tr>`;
  const body=gs.map(g=>{const res=g.pf>g.pa?'W':g.pf<g.pa?'L':'T';
    return `<tr><td class="l">${g.week}</td><td class="l">${g.home?'v':'@'} ${g.opp}</td><td class="l ${res==='W'?'win':res==='L'?'loss':''}">${res} ${g.pf}-${g.pa}</td>`+
      c.map(x=>{const v=cellVal(g,x[1]); return `<td>${x[2]==='bar'?bar(v,.4):x[2](v)}</td>`;}).join('')+`</tr>`;}).join('');
  const A=season(ab);
  const avg=`<tr class="avg"><td class="l" colspan="3">Season${gs.length>1?` (${gs.length})`:''}</td>`+
    c.map(x=>{const v=A[x[1]]; return `<td>${x[2]==='bar'?bar(v,.4):x[2](v)}${rk(ab,x[1])}</td>`;}).join('')+`</tr>`;
  return `<table><thead>${head}</thead><tbody>${body||`<tr><td colspan="${c.length+3}" class="l dim">No games played yet.</td></tr>`}${avg}</tbody></table>`;
}
function marketTable(gs,ab){

    <td class="l ${g.ats==='win'?'win':g.ats==='loss'?'loss':''}">${g.ats||'\u2014'}</td>
    <td class="dim">${F.tot(g.open_total)}</td><td>${F.tot(g.close_total)}</td><td>${g.total_move==null?'\u2014':(g.total_move>0?'+':'')+g.total_move}</td><td>${ttag(g.total_market)}</td>

  const sum=(lbl,m)=>`<tr><td class="l lab2">${lbl}</td><td>${m.for}</td><td>${m.against}</td><td>${m.push}</td><td>${m.ats_w}-${m.ats_l}</td>

  </tbody></table>`;
}

    ${plain('Total',tk(A),tk(H))}`)}
  <div class="two"><div class="card"><h4>${ta.name}</h4><div class="proj" style="margin-bottom:6px">${ta.header}</div><div class="coach">${ta.coaching}</div>${log(A)}${ta.diggs?`<details><summary>Diggs vs FTN</summary><div class="prose diggs">${ta.diggs}</div></details>`:''}<details><summary>Bottom line (FTN)</summary><div class="prose">${ta.bottom}</div></details></div>
  <div class="card"><h4>${th.name}</h4><div class="proj" style="margin-bottom:6px">${th.header}</div><div class="coach">${th.coaching}</div>${log(H)}${th.diggs?`<details><summary>Diggs vs FTN</summary><div class="prose diggs">${th.diggs}</div></details>`:''}<details><summary>Bottom line (FTN)</summary><div class="prose">${th.bottom}</div></details></div></div>`;
}

// ---------- notes ----------
function notesView(){
  return `<div class="head"><h2>Almanac notes</h2></div>`+D.extras.map(e=>`<div class="card"><details ${/Appendix C/.test(e.title)?'open':''}><summary>${e.title}</summary><div class="prose">${e.html}</div></details></div>`).join('');
}

function render(){
  RANKS=null;
  document.querySelectorAll('.top nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.view===S.view)&&b.setAttribute('aria-current','page'));
  document.querySelectorAll('.top nav button').forEach(b=>{if(b.dataset.view===S.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  rail();
  $('main').innerHTML={team:teamView,league:leagueView,week:weekView,notes:notesView,match:matchupView}[S.view]();
  $('main').querySelectorAll('[data-a][data-h]').forEach(b=>b.addEventListener('click',()=>{S.match={a:b.dataset.a,h:b.dataset.h,w:+b.dataset.w};S.view='match';render();window.scrollTo(0,0);}));
  const f=$('filt'); if(f)f.addEventListener('change',()=>{S.filtered=f.checked;render();});
  const n=$('noto'); if(n)n.addEventListener('change',()=>{S.noTO=n.checked;render();});
  $('main').querySelectorAll('th.sort').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.k;if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=['name','rec','ou','tempo','ntempo','opp_sr','opp_epa','opp_db_epa','opp_expl'].includes(k)?1:-1;}render();}));
  $('main').querySelectorAll('button.tl').forEach(b=>b.addEventListener('click',()=>{S.team=b.dataset.team;S.view='team';render();window.scrollTo(0,0);}));
  $('main').querySelectorAll('.wksel button[data-w]').forEach(b=>b.addEventListener('click',()=>{S.week=+b.dataset.w;render();}));
  $('main').querySelectorAll('.wksel button[data-ls]').forEach(b=>b.addEventListener('click',()=>{S.lsec=b.dataset.ls;S.sort=LSEC[S.lsec][2][1];S.dir=-1;render();}));
  const wxEl=$('wx');
  if(wxEl&&S.view==='match'){ const k=`${S.match.w}|${S.match.a}@${S.match.h}`; if(D.sched&&D.sched[k]) loadWeather(wxEl,D.sched[k]); }
  $('meta').textContent=`Data through week ${D.weeks[D.weeks.length-1]||'\u2014'} \u00b7 updated ${D.updated}`;
}
render();
})();
</script>
